name: Nightly Database Backup

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

env:
  BACKUP_PREFIX: db-backups

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PostgreSQL client + AWS CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client awscli

      - name: Dump & compress database
        id: dump
        env:
          DB_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          mkdir -p backups
          STAMP=$(date -u +'%Y-%m-%d_%H-%M')
          FILE="backups/manavi-${STAMP}.sql.gz"
          pg_dump "$DB_URL" --clean --if-exists --no-owner --no-privileges | gzip -9 > "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$FILE" | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload to B2 (S3-compatible) for durable long-term storage
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: |
          aws --endpoint-url "${{ secrets.S3_ENDPOINT }}" s3 cp \
            "${{ steps.dump.outputs.file }}" \
            "s3://${{ secrets.S3_BUCKET }}/${BACKUP_PREFIX}/${{ steps.dump.outputs.stamp }}.sql.gz"

      - name: Also keep a 7-day artifact copy
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ steps.dump.outputs.stamp }}
          path: ${{ steps.dump.outputs.file }}
          retention-days: 7

      - name: Notify Telegram (success)
        if: success()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.ADMIN_TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="✅ بکاپ دیتابیس ماناوی گرفته شد%0Aحجم: ${{ steps.dump.outputs.size }}%0Aزمان: ${{ steps.dump.outputs.stamp }} UTC"

      - name: Notify Telegram (failure)
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.ADMIN_TELEGRAM_CHAT_ID }}" \
            -d parse_mode="HTML" \
            -d text="🔴 بکاپ‌گیری دیتابیس ماناوی شکست خورد%0A<a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">مشاهده لاگ</a>"